# Configuración del escáner de acciones de EE.UU.
# Todos los valores tienen un valor por defecto en bolsa/config.py; aquí solo
# hace falta cambiar lo que quieras ajustar.

universo:
  # Listas que se descargan de Wikipedia: sp500, nasdaq100
  fuentes: [sp500, nasdaq100]
  # Tickers adicionales que quieras vigilar siempre
  extra: []
  # 0 = sin límite. Útil para pruebas rápidas.
  max_tickers: 0
  # Lista de respaldo si Wikipedia no responde
  respaldo: config/universo_respaldo.csv

datos:
  # Historial a descargar. 5 años alcanza para las medias móviles y para
  # que la red neuronal tenga miles de ejemplos de entrenamiento.
  periodo: 5y
  # Índices de referencia del mercado (no se puntúan como oportunidades)
  indices: [SPY, QQQ, DIA, IWM]

escaneo:
  precio_minimo: 5
  volumen_medio_minimo: 500000       # acciones/día (media de 20 días)
  candidatos_fase2: 40               # pasan al análisis de noticias y analistas
  top_oportunidades: 15              # cuántas se muestran con gráfico y análisis
  dias_grafico: 180                  # velas que se dibujan en cada gráfico

noticias:
  max_por_accion: 12
  dias_recientes: 14
  vida_media_dias: 3                 # las noticias viejas pesan menos
  google_news: true                  # complementa las noticias de Yahoo

# Peso de cada componente en el puntaje final (se normalizan solos).
# El peso de la red neuronal solo se aplica cuando la red está "lista".
pesos:
  tecnico: 0.35
  momentum: 0.20
  noticias: 0.20
  analistas: 0.25
  red_neuronal: 0.25

# Cartera simulada que el sistema compra y vende sola para hacer seguimiento.
cartera:
  capital_inicial: 100000
  max_posiciones: 10
  max_compras_por_dia: 3
  puntaje_minimo_compra: 65
  stop_loss_pct: 0.08                # stop inicial: -8% (o 2.5×ATR si es más amplio)
  stop_atr: 2.5
  objetivo_pct: 0.25                 # toma de ganancias: +25%
  activar_stop_dinamico: 0.10        # desde +10% el stop sube con el precio
  stop_dinamico_pct: 0.08
  max_dias_sin_avance: 60

red_neuronal:
  # "Maestro" que etiqueta los ejemplos: un día es un buen punto de compra si
  # comprando ese día se podía vender en el máximo de los próximos
  # `horizonte` días con al menos `ganancia_minima`, sin que antes el precio
  # cayera más de `caida_maxima`. Es decir: comprar en el mínimo, vender en el máximo.
  horizonte: 20
  ganancia_minima: 0.08
  caida_maxima: 0.03
  capas: [128, 64, 32]
  tasa_aprendizaje: 0.001
  l2: 0.0001
  batch: 512
  muestras_por_epoca: 250000
  max_epocas_por_sesion: 15
  paciencia: 3
  minutos_por_sesion: 8              # entrenamiento diario
  minutos_sesion_profunda: 45        # entrenamiento semanal
  dias_validacion: 126
  top_predicciones: 10               # se registran cada día para evaluarlas en vivo
  # Criterios para considerar que la red "aprendió lo suficiente"
  madurez:
    sesiones_minimas: 20
    auc_minimo: 0.60
    lift_minimo: 1.4
    # La red debe superar a una regla simple (elegir las acciones más volátiles)
    # por al menos este margen de AUC; así no se da por "lista" solo por
    # detectar volatilidad.
    ventaja_sobre_referencia: 0.02
    predicciones_evaluadas_minimas: 60
    ventaja_vivo_minima: 1.2         # precisión en vivo / tasa base

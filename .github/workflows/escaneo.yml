name: Escaneo del mercado y gráficos

on:
  schedule:
    # Lunes a viernes a las 22:30 UTC: después del cierre de Wall Street
    # (funciona con y sin horario de verano).
    - cron: "30 22 * * 1-5"
    # Sábados a las 12:00 UTC: sesión larga de entrenamiento de la red neuronal.
    - cron: "0 12 * * 6"
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué ejecutar"
        type: choice
        options: [escanear, entrenar]
        default: escanear
      minutos:
        description: "Minutos de entrenamiento de la red (vacío = lo que diga config.yaml)"
        required: false
        default: ""
      max_tickers:
        description: "Limitar el número de acciones para una prueba rápida (0 = todas)"
        required: false
        default: "0"

permissions:
  contents: write

# Nunca dos ejecuciones a la vez: ambas escriben el estado en la rama "reportes"
concurrency:
  group: reportes
  cancel-in-progress: false

env:
  RAMA_REPORTES: reportes

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar el estado anterior (cartera, red neuronal, historial)
        run: |
          mkdir -p salida
          if git fetch --depth=1 origin "$RAMA_REPORTES" 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C salida
            echo "Estado anterior recuperado de la rama $RAMA_REPORTES"
          else
            echo "Primera ejecución: la cartera y la red neuronal empiezan desde cero"
          fi

      - name: Escanear el mercado / entrenar la red
        env:
          MODO: ${{ inputs.modo || (github.event.schedule == '0 12 * * 6' && 'entrenar' || 'escanear') }}
          MINUTOS: ${{ inputs.minutos }}
          MAX_TICKERS: ${{ inputs.max_tickers }}
          # Opcional: clave gratuita de https://finnhub.io para más noticias
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          ARGS=(--salida salida)
          if [ -n "$MINUTOS" ]; then ARGS+=(--minutos "$MINUTOS"); fi
          if [ -n "$MAX_TICKERS" ] && [ "$MAX_TICKERS" != "0" ]; then ARGS+=(--max-tickers "$MAX_TICKERS"); fi
          echo "Modo: $MODO"
          python -m bolsa "$MODO" "${ARGS[@]}"

      - name: Publicar reportes y gráficos en la rama "reportes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd salida
          git init -q -b "$RAMA_REPORTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Reporte $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Un solo commit con la última versión: la rama no crece con cada gráfico
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$RAMA_REPORTES"
          echo "Reporte: https://github.com/${GITHUB_REPOSITORY}/blob/${RAMA_REPORTES}/README.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Copia de seguridad del estado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estado-${{ github.run_id }}
          path: salida/estado
          retention-days: 30
          if-no-files-found: ignore

      - name: Resumen en la ejecución
        if: success()
        run: |
          if [ -f salida/README.md ]; then
            grep -v '^!\[' salida/README.md | head -c 60000 >> "$GITHUB_STEP_SUMMARY"
          fi

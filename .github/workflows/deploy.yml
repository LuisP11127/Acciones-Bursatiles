name: Deploy dashboard

# Genera los JSON estáticos (desde el estado versionado y la caché de precios),
# compila el frontend y lo publica en GitHub Pages. Se ejecuta tras cada
# actualización de mercado o entrenamiento, y cuando cambia el frontend.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src/pipeline/export.py"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}  # punta de la rama: incluye el commit de datos recién guardado

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias (sin PyTorch)
        run: pip install -r requirements.txt

      - name: Restaurar caché de precios (gráficos)
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: market-raw-deploy-${{ github.run_id }}
          restore-keys: market-raw-

      - name: Exportar datos para la web
        run: python scripts/export_frontend.py

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Model training

# Semanal: sábados 12:40 UTC (mercado cerrado). Construye el dataset, valida con
# walk-forward, entrena el candidato, ejecuta el backtest completo y solo
# sustituye el modelo en producción si cumple los criterios de config/model.yaml.
on:
  schedule:
    - cron: "40 12 * * 6"
  workflow_dispatch:
    inputs:
      task:
        description: "Qué ejecutar"
        type: choice
        options: [train_and_backtest, backtest_only]
        default: train_and_backtest

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      status: ${{ steps.train.outputs.status || steps.backtest.outputs.status }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias (PyTorch CPU)
        run: pip install -r requirements-dev.txt

      - name: Restaurar caché de precios
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: market-raw-${{ github.run_id }}
          restore-keys: market-raw-

      - name: Restaurar predicciones fuera de muestra
        uses: actions/cache/restore@v4
        with:
          path: data/processed
          key: model-processed-${{ github.run_id }}
          restore-keys: model-processed-

      - name: Tests del modelo, backtest y fugas
        run: python -m pytest -q tests/test_no_leakage.py tests/test_model.py tests/test_backtest.py tests/test_features.py

      - name: Entrenar, validar, comparar y backtest
        id: train
        if: inputs.task != 'backtest_only'
        run: python scripts/train_model.py

      - name: Solo backtest
        id: backtest
        if: inputs.task == 'backtest_only'
        run: |
          python scripts/run_backtest.py --update-data
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Guardar caché de precios
        if: always() && hashFiles('data/raw/**') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: market-raw-${{ github.run_id }}

      - name: Guardar predicciones fuera de muestra
        if: always() && hashFiles('data/processed/**') != ''
        uses: actions/cache/save@v4
        with:
          path: data/processed
          key: model-processed-${{ github.run_id }}

      - name: Guardar modelo y resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models data/results data/universe
          if git diff --cached --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -q -m "modelo: entrenamiento y backtest $(date -u +%F)"
          for intento in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((intento * 5))
          done
          exit 1

  deploy:
    needs: train
    if: needs.train.outputs.status == 'ok'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

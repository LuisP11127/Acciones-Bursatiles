name: Market update

# GitHub Actions solo admite cron en UTC. 22:15 UTC son las 18:15 en Nueva York con
# horario de verano (EDT) y las 17:15 en invierno (EST): siempre después del cierre
# de las 16:00. El propio pipeline consulta el calendario de la NYSE
# (src/market_calendar.py, zona America/New_York) y no hace nada en festivos o si la
# sesión ya está procesada.
on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Procesar aunque la sesión ya tenga snapshot"
        type: boolean
        default: false
      max_symbols:
        description: "Limitar el universo para una prueba rápida (0 = todo)"
        default: "0"

permissions:
  contents: write

# Nunca dos procesos escribiendo el estado a la vez
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      status: ${{ steps.pipeline.outputs.status }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Restaurar caché de precios
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: market-raw-${{ github.run_id }}
          restore-keys: market-raw-

      - name: Tests críticos (calidad de datos y fugas de información)
        run: python -m pytest -q tests/test_no_leakage.py tests/test_data.py tests/test_features.py tests/test_trading.py

      - name: Pipeline diario
        id: pipeline
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FORCE: ${{ inputs.force }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
        run: |
          ARGS=()
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ -n "$MAX_SYMBOLS" ] && [ "$MAX_SYMBOLS" != "0" ]; then ARGS+=(--max-symbols "$MAX_SYMBOLS"); fi
          python scripts/generate_signals.py "${ARGS[@]}"

      - name: Validar la exportación antes de publicar
        if: steps.pipeline.outputs.status == 'ok'
        run: python scripts/export_frontend.py --out "$RUNNER_TEMP/export-check"

      - name: Guardar caché de precios
        if: always() && hashFiles('data/raw/**') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: market-raw-${{ github.run_id }}

      - name: Guardar resultados en el repositorio
        if: steps.pipeline.outputs.status == 'ok'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state data/history data/news data/universe data/results
          if git diff --cached --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -q -m "datos: actualización de mercado ${{ steps.pipeline.outputs.as_of }}"
          for intento in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((intento * 5))
          done
          exit 1

  deploy:
    needs: update
    if: needs.update.outputs.status == 'ok'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
